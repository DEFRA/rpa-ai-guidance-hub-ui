services:
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - rpa-ai-guidance-hub-ui

  rpa-ai-guidance-hub-ui:
    build: ./
    ports:
      - '3000:3000'
    env_file:
      - '.env'
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      FLOCI_ENDPOINT: http://floci:4566
      USE_SINGLE_INSTANCE_CACHE: true
    networks:
      - rpa-ai-guidance-hub-ui

networks:
  rpa-ai-guidance-hub-ui:
    driver: bridge
